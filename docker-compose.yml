services:
  db:
    image: postgres:16-alpine
    container_name: techasset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techasset
    ports:
      - "5432:5432"
    volumes:
      - techasset-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techasset"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  techasset-data:
